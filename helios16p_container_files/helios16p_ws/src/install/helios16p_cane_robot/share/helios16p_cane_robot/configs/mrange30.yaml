kiss_icp_node:
  ros__parameters:

    data:
      deskew: True
      max_range: 30.0
      min_range: 0.35

    mapping:
      max_points_per_voxel: 15
      voxel_size: 0.3 
   
    adaptive_threshold:
      initial_threshold: 2.0
      min_motion_th: 0.1

    registration:
      max_num_iterations: 400
      convergence_criterion: 0.0001
      max_num_threads: 0 