

kiss_icp_node:
  ros__parameters:

    data:
      deskew: True
      max_range: 5.0
      min_range: 0.35

    mapping:
      max_points_per_voxel: 5
      voxel_size: 0.2
   
    adaptive_threshold:
      initial_threshold: 4.0
      min_motion_th: 0.2

    registration:
      max_num_iterations: 300
      convergence_criterion: 0.000025
      max_num_threads: 0 
