kiss_icp_node:
  ros__parameters:

    data:
      deskew: True
      max_range: 15.0
      min_range: 0.35

    mapping:
      max_points_per_voxel: 10
      voxel_size: 0.5
   
    adaptive_threshold:
      initial_threshold: 2.0
      min_motion_th: 0.1

    registration:
      max_num_iterations: 200
      convergence_criterion: 0.000025
      max_num_threads: 0 